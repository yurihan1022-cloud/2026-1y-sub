<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과학 1 수업자료 라이브러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --solid:   #4C7CC7;
    --solid-l: #E4EEFC;
    --liquid:  #2AA6A0;
    --liquid-l:#DEF6F3;
    --gas:     #F2914B;
    --gas-l:   #FFEEDC;
    --warm:    #EE6B4D;
    --cool:    #3E7CC9;
    --ink:     #26324A;
    --ink-soft:#5B6B85;
    --paper:   #FBFCFE;
    --card:    #FFFFFF;
    --line:    #E4E9F2;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 4%, var(--solid-l) 0%, transparent 40%),
      radial-gradient(circle at 95% 10%, var(--gas-l) 0%, transparent 38%),
      radial-gradient(circle at 50% 70%, var(--liquid-l) 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.65;
    padding-bottom:80px;
  }
  h1,h2,h3,.jua{font-family:'Jua', sans-serif; font-weight:400;}

  /* ===== Top bar ===== */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(251,252,254,0.92);
    backdrop-filter:blur(8px);
    border-bottom:2px solid var(--line);
    padding:12px 5vw;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .topbar .brand{
    font-family:'Jua',sans-serif; font-size:1.05rem; color:var(--solid);
    white-space:nowrap;
  }
  .topbar .brand span{color:var(--gas);}
  .searchbox{
    flex:1; min-width:180px; max-width:340px; margin-left:auto;
    display:flex; align-items:center; gap:8px;
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:8px 16px;
  }
  .searchbox input{
    border:none; outline:none; font-family:'Noto Sans KR',sans-serif;
    font-size:.88rem; width:100%; background:transparent; color:var(--ink);
  }
  .searchbox .ic{opacity:.5;}

  /* ===== Hero ===== */
  .hero{
    max-width:980px; margin:40px auto 6px; padding:0 5vw; text-align:center;
  }
  .hero .kicker{
    font-size:0.8rem; color:var(--ink-soft); font-weight:500;
    background:#fff; display:inline-block; padding:6px 16px; border-radius:999px;
    border:1px solid var(--line); margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(1.9rem,4.6vw,2.9rem); margin:0 0 8px; color:var(--ink);
  }
  .hero h1 .hl{color:var(--liquid);}
  .hero p.sub{color:var(--ink-soft); font-size:1.02rem; margin-top:0;}
  .hero-art{display:flex; justify-content:center; gap:22px; margin:24px 0 6px; flex-wrap:wrap;}
  .hero-chip{
    width:78px; height:78px; border-radius:24px;
    display:flex; align-items:center; justify-content:center; font-size:2.1rem;
    box-shadow:0 10px 24px -12px rgba(38,50,74,.25);
    animation:bob 3.4s ease-in-out infinite;
  }
  .hero-chip.s{background:var(--solid-l);}
  .hero-chip.l{background:var(--liquid-l); animation-delay:.4s;}
  .hero-chip.g{background:var(--gas-l); animation-delay:.8s;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
  @media(prefers-reduced-motion:reduce){.hero-chip{animation:none;}}

  .wrap{max-width:980px; margin:0 auto; padding:0 5vw;}

  /* ===== Unit group ===== */
  .unit-group{margin-top:56px;}
  .unit-head{
    display:flex; align-items:baseline; gap:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  .unit-head h2{font-size:clamp(1.3rem,3vw,1.7rem); margin:0;}
  .unit-count{
    font-size:.8rem; color:var(--ink-soft); background:#fff; border:1px solid var(--line);
    padding:3px 12px; border-radius:999px;
  }

  .lesson-list{display:flex; flex-direction:column; gap:12px;}
  .lesson-row{
    display:flex; align-items:center; gap:16px;
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:16px 20px; text-decoration:none; color:var(--ink);
    box-shadow:0 10px 22px -18px rgba(38,50,74,.35);
    transition:.15s;
  }
  .lesson-row:hover{transform:translateY(-2px); box-shadow:0 16px 28px -16px rgba(38,50,74,.4); border-color:var(--liquid);}
  .lesson-row.disabled{
    opacity:.55; cursor:default; pointer-events:none;
    border-style:dashed;
  }
  .lesson-ic{
    flex:0 0 auto; width:48px; height:48px; border-radius:16px;
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
  }
  .lesson-main{flex:1; min-width:0;}
  .lesson-label{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Jua',sans-serif; font-size:.82rem;
    padding:3px 11px; border-radius:999px; margin-bottom:6px;
  }
  .lesson-title{
    font-weight:700; font-size:1.05rem; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lesson-meta{font-size:.8rem; color:var(--ink-soft); margin-top:3px;}
  .lesson-arrow{
    flex:0 0 auto; font-size:1.3rem; color:var(--ink-soft); transition:.15s;
  }
  .lesson-row:hover .lesson-arrow{color:var(--liquid); transform:translateX(3px);}

  .tag-lesson .lesson-ic{background:var(--solid-l);}
  .tag-lesson .lesson-label{background:var(--solid-l); color:var(--solid);}
  .tag-review .lesson-ic{background:var(--liquid-l);}
  .tag-review .lesson-label{background:var(--liquid-l); color:var(--liquid);}
  .tag-activity .lesson-ic{background:var(--gas-l);}
  .tag-activity .lesson-label{background:var(--gas-l); color:#C6631C;}
  .tag-wrap .lesson-ic{background:#F1E9FB;}
  .tag-wrap .lesson-label{background:#F1E9FB; color:#7C4DBF;}

  .empty-note{
    text-align:center; color:var(--ink-soft); font-size:.88rem;
    padding:20px; border:1.5px dashed var(--line); border-radius:16px; margin-top:14px;
  }

  footer{text-align:center; color:var(--ink-soft); font-size:.8rem; margin-top:80px;}

  .fade-in{opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease;}
  .fade-in.in{opacity:1; transform:translateY(0);}

  @media(max-width:520px){
    .lesson-title{white-space:normal;}
    .lesson-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🧪 미래엔 과학 1 <span>수업자료 라이브러리</span></div>
  <div class="searchbox">
    <span class="ic">🔍</span>
    <input id="searchInput" type="text" placeholder="차시나 제목으로 검색...">
  </div>
</div>

<div class="hero">
  <div class="kicker">중학교 과학 1 · 전체 차시 모음</div>
  <h1>우리 반 <span class="hl">수업자료 모음집</span></h1>
  <p class="sub">차시가 만들어질 때마다 여기에 하나씩 쌓여요. 제목을 눌러 바로 수업 자료로 이동하세요.</p>
  <div class="hero-art">
    <div class="hero-chip s">🧊</div>
    <div class="hero-chip l">💧</div>
    <div class="hero-chip g">☁️</div>
  </div>
</div>

<div class="wrap" id="unitContainer">
  <!-- JS가 이 안에 대단원별 목록을 그려줍니다 -->
</div>

<footer>미래엔 중학교 과학 1 · 수업자료 라이브러리 · 새 차시는 계속 추가됩니다</footer>

<script>
/* =========================================================
   ▶ 여기에 차시를 추가하세요
   -----------------------------------------------------------
   unit  : 대단원 이름 (같은 unit끼리 자동으로 묶여요)
   label : "중단원-소단원" 형식 (예: "1-3", "2-1")
   title : 소단원 제목
   url   : 수업 자료 링크 (Netlify 등에 배포한 주소)
   type  : "lesson"(일반 차시) | "review"(중단원 정리)
           | "activity"(창의 활동) | "wrap"(대단원 마무리)
   ========================================================= */
  const LESSONS = [
    {
      unit: "Ⅳ. 물질의 상태 변화",
      label: "1-3",
      title: "물질의 상태 변화",
      url: "https://storied-nasturtium-9c033c.netlify.app/",
      type: "lesson"
    },
    {
      unit: "Ⅳ. 물질의 상태 변화",
      label: "1-4",
      title: "상태 변화와 입자 배열의 변화",
      url: "https://dsy20261-4-14.netlify.app/",
      type: "lesson"
    },
    {
      unit: "Ⅳ. 물질의 상태 변화",
      label: "2-1",
      title: "열에너지를 흡수하는 상태 변화",
      url: "https://2026s-1-4-2.netlify.app/",
      type: "lesson"
    },
    {
      unit: "Ⅳ. 물질의 상태 변화",
      label: "2-2",
      title: "열에너지를 방출하는 상태 변화",
      url: "https://dsy2026-1-4-2-2.netlify.app/",
      type: "lesson"
    },
    {
      unit: "Ⅳ. 물질의 상태 변화",
      label: "2-3",
      title: "상태 변화와 열에너지의 이용",
      url: "https://dsy2026-1-4-2-3.netlify.app/",
      type: "lesson"
    },
    {
      unit: "Ⅴ. 힘의 작용",
      label: "5_1_1",
      title: "힘의 표현",
      url: "https://2026-1y-51.vercel.app/",
      type: "lesson"
    },
    {
      unit: "Ⅴ. 힘의 작용",
      label: "5_1_2",
      title: "힘의 평형",
      url: "https://2026-1y-52.vercel.app/",
      type: "lesson"
    },
    // 👇 새 차시를 추가할 땐 이렇게 쉼표로 이어서 붙여주세요
    // {
    //   unit: "Ⅳ. 물질의 상태 변화",
    //   label: "1-4",
    //   title: "상태 변화와 입자 배열의 변화",
    //   url: "https://다음배포주소.netlify.app/",
    //   type: "lesson"
    // },
  ];

  const TYPE_META = {
    lesson:   { icon: "📘", cls: "tag-lesson",   badge: "차시" },
    review:   { icon: "🔄", cls: "tag-review",   badge: "중단원 정리" },
    activity: { icon: "🎨", cls: "tag-activity", badge: "창의 활동" },
    wrap:     { icon: "🏁", cls: "tag-wrap",     badge: "대단원 마무리" },
  };

  function groupByUnit(lessons){
    const map = new Map();
    lessons.forEach(l=>{
      if(!map.has(l.unit)) map.set(l.unit, []);
      map.get(l.unit).push(l);
    });
    return map;
  }

  function render(filterText){
    const container = document.getElementById('unitContainer');
    container.innerHTML = '';
    const q = (filterText||'').trim().toLowerCase();

    const filtered = LESSONS.filter(l=>{
      if(!q) return true;
      return (l.label+' '+l.title+' '+l.unit).toLowerCase().includes(q);
    });

    if(filtered.length === 0){
      container.innerHTML = '<div class="empty-note">검색 결과가 없어요. 다른 검색어로 시도해 보세요.</div>';
      return;
    }

    const groups = groupByUnit(filtered);
    let i = 0;
    groups.forEach((lessons, unitName)=>{
      const section = document.createElement('section');
      section.className = 'unit-group fade-in';

      const head = document.createElement('div');
      head.className = 'unit-head';
      head.innerHTML = `<h2>${unitName}</h2><span class="unit-count">${lessons.length}개 차시</span>`;
      section.appendChild(head);

      const list = document.createElement('div');
      list.className = 'lesson-list';

      lessons.forEach(l=>{
        const meta = TYPE_META[l.type] || TYPE_META.lesson;
        const row = document.createElement('a');
        row.href = l.url;
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
        row.className = `lesson-row ${meta.cls}`;
        row.innerHTML = `
          <div class="lesson-ic">${meta.icon}</div>
          <div class="lesson-main">
            <span class="lesson-label">${l.label}. ${l.title}</span>
            <p class="lesson-title">${l.label}. ${l.title}</p>
            <div class="lesson-meta">${meta.badge}</div>
          </div>
          <div class="lesson-arrow">↗</div>
        `;
        list.appendChild(row);
      });

      section.appendChild(list);
      container.appendChild(section);
      i++;
    });

    // fade-in observer (재적용)
    document.querySelectorAll('.fade-in').forEach(el=>io.observe(el));
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); } });
  }, {threshold:0.06});

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    render(e.target.value);
  });

  render('');
</script>
</body>
</html>
